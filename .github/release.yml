# GitHub 自动生成 Release Notes 的分类规则
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 新功能
      labels:
        - feat
        - enhancement
    - title: 修复
      labels:
        - fix
        - bug
    - title: 文档
      labels:
        - docs
    - title: 构建、脚本与 CI
      labels:
        - chore
        - build
        - ci
    - title: 其他变更
      labels:
        - "*"
